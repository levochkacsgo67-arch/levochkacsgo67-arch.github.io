<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Погода · Южно-Сахалинск</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Погода">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#05070b;--ink:#f5f7fa;--ink2:rgba(245,247,250,.62);--ink3:rgba(245,247,250,.36);--line:rgba(255,255,255,.08);
  --a:#1d4f9c;--b:#0d2a5c;--c:#3a7bd5;--r:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
p{margin:0}

.sky{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
.blob{position:absolute;border-radius:50%;filter:blur(100px);will-change:transform;transition:background-color 2.4s ease}
.blob.b1{width:80vmax;height:80vmax;left:-30vmax;top:-38vmax;background:var(--a);opacity:.42;animation:drift1 42s ease-in-out infinite alternate}
.blob.b2{width:70vmax;height:70vmax;right:-34vmax;top:30vh;background:var(--b);opacity:.7;animation:drift2 50s ease-in-out infinite alternate}
.blob.b3{width:50vmax;height:50vmax;left:0;bottom:-34vmax;background:var(--c);opacity:.22;animation:drift3 56s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(14vmax,10vmax,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-16vmax,-8vmax,0) scale(.9)}}
@keyframes drift3{to{transform:translate3d(12vmax,-12vmax,0) scale(1.2)}}
.grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.6) 100%);pointer-events:none}
#fx{position:absolute;inset:0;width:100%;height:100%}
.flash{position:absolute;inset:0;background:#cfd8ff;opacity:0;pointer-events:none;mix-blend-mode:screen}

.glass{position:relative;border-radius:var(--r);isolation:isolate;
  background:linear-gradient(145deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 48%,rgba(255,255,255,.05) 100%);
  -webkit-backdrop-filter:blur(28px) saturate(180%) brightness(.9);backdrop-filter:blur(28px) saturate(180%) brightness(.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.04),inset 0 0 26px rgba(255,255,255,.03),0 16px 40px -14px rgba(0,0,0,.6)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,.05) 28%,rgba(255,255,255,0) 54%,rgba(255,255,255,.12) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;opacity:0;transition:opacity .5s ease;background:radial-gradient(260px circle at var(--x,50%) var(--y,0%),rgba(255,255,255,.14),transparent 62%)}
.glass.lit::after{opacity:1}
.pad{padding:24px}
.label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:0 0 18px}
.label em{font-style:normal;letter-spacing:.01em;text-transform:none;font-size:13px;font-weight:500;color:var(--ink2)}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 44px)}
.stack{display:grid;gap:14px}
.reveal{opacity:0;transform:translateY(24px);filter:blur(8px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}
.reveal.in{opacity:1;transform:none;filter:none}

.top{display:flex;align-items:center;justify-content:space-between;height:40px}
.city{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink2)}
.refresh{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin-right:-8px}
.refresh svg{width:18px;height:18px;fill:none;stroke:var(--ink2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh:active{opacity:.5}

.hero{text-align:center;padding:30px 0 34px}
.date{font-size:15px;color:var(--ink2)}.date::first-letter{text-transform:uppercase}
.temp{font-size:clamp(120px,36vw,160px);font-weight:200;letter-spacing:-.06em;line-height:.92;margin:12px 0 0;padding-left:.1em;
  background:linear-gradient(180deg,#fff 25%,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent}
.temp sup{font-size:.4em;font-weight:200;vertical-align:top;position:relative;top:.14em;margin-left:.02em;letter-spacing:0}
.cond{display:flex;align-items:center;justify-content:center;gap:9px;font-size:20px;font-weight:500;letter-spacing:-.015em;margin-top:10px}
.cond svg{width:24px;height:24px;stroke-width:1.5}
.feels{font-size:14.5px;color:var(--ink2);margin-top:4px}
.range{display:flex;align-items:center;gap:12px;max-width:240px;margin:26px auto 0;font-size:14px;font-weight:600;color:var(--ink2)}
.range .lo{width:34px;text-align:right}.range .hi{width:34px;text-align:left}
.rtrack{position:relative;flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.1)}
.rfill{position:absolute;inset:0;border-radius:9px;transform-origin:left;transform:scaleX(0);transition:transform 1.5s var(--ease) .5s}
.rfill.go{transform:scaleX(1)}
.rdot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(5,7,11,.6),0 0 14px rgba(255,255,255,.7);transition:left 1.5s var(--ease) .5s;left:0}

.seg{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:99px;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);margin-bottom:22px}
.seg button{position:relative;z-index:1;padding:7px 18px;font-size:13px;font-weight:600;color:var(--ink2);border-radius:99px;transition:color .3s}
.seg button.on{color:#fff}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/2);border-radius:99px;transition:transform .55s var(--ease);background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.11));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 10px rgba(0,0,0,.3)}
.verdict{font-size:clamp(26px,7.4vw,32px);font-weight:600;letter-spacing:-.032em;line-height:1.08}
.vsub{font-size:14px;color:var(--ink2);margin:8px 0 22px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.chip{padding:16px 0 16px}
.chip+.chip{padding-left:20px;border-left:1px solid var(--line)}
.chip .k{font-size:11.5px;color:var(--ink3);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.chip .big{font-size:40px;font-weight:200;letter-spacing:-.045em;margin:6px 0 4px;line-height:1}
.chip .sm{font-size:12.5px;color:var(--ink2);line-height:1.35}
.items{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.it{display:flex;gap:12px;align-items:flex-start;opacity:0;transform:translateY(8px);animation:itIn .7s var(--ease) forwards}
@keyframes itIn{to{opacity:1;transform:none}}
.it svg{flex:none;width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;opacity:.9;margin-top:1px}
.it b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.012em;line-height:1.2}
.it span{display:block;font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.3}
.tip{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45;color:var(--ink2)}
.tip p+p{margin-top:8px}
.tip b{color:var(--ink);font-weight:600}

#chart svg{width:100%;height:auto;overflow:visible;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ct1{font-size:13px;font-weight:600;fill:#fff}.ct2{font-size:9.5px;fill:rgba(255,255,255,.45);letter-spacing:.04em}.ct3{font-size:9.5px;fill:rgba(255,255,255,.34);letter-spacing:.04em}
.cline{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.2s var(--ease) .3s}
.in .cline{stroke-dashoffset:0}
.carea{opacity:0!important;transition:opacity 1.6s ease .9s}
.in .carea{opacity:.26!important}
.mk{opacity:0;transition:opacity .8s ease 1.6s}
.in .mk{opacity:1}

.day{display:grid;grid-template-columns:76px 28px 1fr 34px;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:15.5px;font-weight:600}
.day:first-child{border-top:0;padding-top:0}.day:last-child{padding-bottom:0}
.day .ico{width:24px;height:24px;stroke-width:1.5}
.dbar{display:flex;align-items:center;gap:10px}
.dbar .n{width:32px;text-align:right;color:var(--ink2);font-weight:500}
.dbar .x{width:32px}
.dtrack{position:relative;flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.09)}
.dfill{position:absolute;top:0;bottom:0;border-radius:9px;transform-origin:left;transform:scaleX(0);transition:transform 1.2s var(--ease)}
.in .dfill,.dfill.go{transform:scaleX(1)}
.dpop{font-size:11.5px;color:#7cc4ff;font-weight:600;text-align:right}

.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fig .k{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.fig .v{font-size:25px;font-weight:300;letter-spacing:-.03em;margin-top:7px;line-height:1.05}
.fig .v small{display:block;font-size:12px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-top:3px}

details.glass{padding:0}
details summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:20px 24px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
details summary::-webkit-details-marker{display:none}
details summary em{font-style:normal;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--ink2)}
details summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--ink3);border-bottom:1.6px solid var(--ink3);transform:rotate(45deg);margin:-3px 0 0 12px;transition:transform .4s var(--ease)}
details[open] summary::after{transform:rotate(-135deg);margin-top:3px}
details .inner{padding:0 24px 22px}
.srow{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-child{border-top:0;padding-top:0}.srow:last-child{padding-bottom:0}
.srow .nm{font-weight:600;line-height:1.15}.srow .nm small{display:block;font-size:11.5px;color:var(--ink3);font-weight:500}
.srow .dbar .n,.srow .dbar .x{width:32px;font-size:13px}
.srow.main .dtrack{height:6px}
.st{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px;background:#5fe3a1;box-shadow:0 0 9px #5fe3a1}
.st.w{background:#ffd166;box-shadow:0 0 9px #ffd166}.st.r{background:#ff6b6b;box-shadow:0 0 9px #ff6b6b}

.foot{text-align:center;color:var(--ink3);font-size:12px;margin-top:26px}
.err{display:none;margin:12px 0;padding:14px 16px;border-radius:20px;font-size:14px;color:#ffd0d0;background:rgba(255,80,80,.12)}
.err.show{display:block}.err button{margin-left:6px;text-decoration:underline;font-weight:600}
.sk .temp,.sk .cond,.sk .feels{opacity:.35;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.15}}
@media(min-width:700px){.app{padding-top:40px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none;filter:none}.cline{stroke-dashoffset:0}.carea{opacity:.26!important}.mk{opacity:1}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <canvas id="fx"></canvas><div class="flash" id="flash"></div><div class="grain"></div><div class="vignette"></div>
</div>

<main class="app" id="app">
  <div class="top"><div class="city">Южно-Сахалинск</div>
    <button class="refresh" id="refresh" aria-label="Обновить"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></div>
  <div class="err" id="err">Не получилось загрузить погоду. <button id="retry">Ещё раз</button></div>

  <section class="hero sk" id="hero">
    <div class="date" id="date">&nbsp;</div>
    <div class="temp" id="temp">--<sup>°</sup></div>
    <div class="cond" id="cond">Загружаю</div>
    <div class="feels" id="feels">&nbsp;</div>
    <div class="range"><span class="lo" id="lo">--°</span><span class="rtrack"><span class="rfill" id="rfill"></span><span class="rdot" id="rdot"></span></span><span class="hi" id="hi">--°</span></div>
  </section>

  <div class="stack">
    <section class="glass pad reveal" id="outfit">
      <div class="seg" id="seg"><i></i><button data-p="0" class="on">Сегодня</button><button data-p="1">Завтра</button></div>
      <h2 class="verdict" id="verdict"></h2>
      <p class="vsub" id="vsub"></p>
      <div class="chips" id="chips"></div>
      <div class="items" id="items"></div>
      <div class="tip" id="tip" style="display:none"></div>
    </section>

    <section class="glass pad reveal" id="day">
      <h3 class="label">День<em id="chartRead"></em></h3>
      <div id="chart"></div>
    </section>

    <section class="glass pad reveal" id="daily">
      <h3 class="label">Неделя</h3>
      <div id="days"></div>
    </section>

    <section class="glass pad reveal" id="det">
      <div class="figs" id="detBox"></div>
    </section>

    <details class="glass reveal" id="srcs">
      <summary>Сверка прогнозов<em id="trustTxt"></em></summary>
      <div class="inner" id="srcBox"></div>
    </details>
  </div>
  <div class="foot" id="foot"></div>
</main>

<script>
(()=>{
'use strict';
const LAT=46.9594, LON=142.7379, TZ='Asia/Sakhalin';
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- значки ---------- */
const P={
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>',
  moon:'<path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/>',
  cloud:'<path d="M7.2 18.5a4.2 4.2 0 0 1-.5-8.4 6 6 0 0 1 11.5 1.6 3.4 3.4 0 0 1-.6 6.8z"/>',
  pcloudD:'<circle cx="8" cy="8" r="2.9"/><path d="M8 2.2v1.2M2.2 8h1.2M3.9 3.9l.8.8M12.1 3.9l-.8.8"/><path d="M9.2 20a3.6 3.6 0 0 1-.4-7.2 5 5 0 0 1 9.6 1.4A3 3 0 0 1 17.8 20z"/>',
  pcloudN:'<path d="M10.6 3.6a4.3 4.3 0 1 0 4.6 5.6 4.3 4.3 0 0 1-4.6-5.6z"/><path d="M9.2 20a3.6 3.6 0 0 1-.4-7.2 5 5 0 0 1 9.6 1.4A3 3 0 0 1 17.8 20z"/>',
  rain:'<path d="M7.2 15a4.2 4.2 0 0 1-.5-8.4 6 6 0 0 1 11.5 1.6A3.4 3.4 0 0 1 17.6 15z"/><path d="M8.5 18l-1 2.6M12.5 18l-1 2.6M16.5 18l-1 2.6"/>',
  snow:'<path d="M7.2 14.5a4.2 4.2 0 0 1-.5-8.4 6 6 0 0 1 11.5 1.6 3.4 3.4 0 0 1-.6 6.8z"/><path d="M8 18.2h.01M12 20.5h.01M16 18.2h.01M12 17.4h.01" stroke-width="2.4"/>',
  storm:'<path d="M7.2 14.5a4.2 4.2 0 0 1-.5-8.4 6 6 0 0 1 11.5 1.6 3.4 3.4 0 0 1-.6 6.8"/><path d="M12.6 12.4l-2.6 4h3.2l-2.2 4.4"/>',
  fog:'<path d="M5 9h14M3 13h18M6 17h12"/>',
  /* одежда */
  puffer:'<path d="M9 3L4 5.8V15l2.4.8V21h11.2v-5.2L20 15V5.8L15 3l-3 2z"/><path d="M12 5v16M6.4 11.5h11.2M6.4 16h11.2"/>',
  jacket:'<path d="M9 3L4 5.8 3 17l3.2.5V21h11.6v-3.5L21 17 20 5.8 15 3l-3 2.5z"/><path d="M12 5.5V21M9 3l3 4.2L15 3"/>',
  sweater:'<path d="M9 4L4 7l-1 12 3 .5L7.5 11 8 20h8l.5-9 1.5 8.5 3-.5L20 7l-5-3a3.2 3.2 0 0 1-6 0z"/>',
  tee:'<path d="M8.5 4L3 7l2 4 3-1v10h8V10l3 1 2-4-5.500-3a3.600 3.600 0 0 1-7 0z"/>',
  pants:'<path d="M7 3h10l1.2 18h-4.700L12 9.500 11.500 21H6z"/><path d="M7 7h10"/>',
  shorts:'<path d="M6.500 5h11l1.500 11h-5.300L12 10.500 10.300 16H5z"/>',
  sneaker:'<path d="M3 16.500V13l3.500-.8L9 9l2.300 2.200 5.200 1.100A3.500 3.500 0 0 1 19.300 15.700V17H3z"/><path d="M3 14.500h16.300M9.500 12.500l1.500 1.500"/>',
  boot:'<path d="M7 3h7v8l5 2.500V19H5z"/><path d="M5 16h14M7 7h7"/>',
  hat:'<path d="M5 15a7 7 0 0 1 14 0z"/><path d="M4 15h16v3H4z"/><circle cx="12" cy="6.2" r="1.700"/>',
  scarf:'<path d="M5 8a7 4 0 0 1 14 0v3a7 4 0 0 1-14 0z"/><path d="M14 13.500l1 7h3l-.8-7.500"/>',
  mitten:'<path d="M7 21v-8a5 5 0 0 1 10 0v8z"/><path d="M7 17h10M7 13l-3-2.500"/>',
  umb:'<path d="M3 12a9 9 0 0 1 18 0z"/><path d="M12 12v6.500a2 2 0 0 0 4 0"/>',
  hood:'<path d="M12 3a7 7 0 0 0-7 7v3l3 5h8l3-5v-3a7 7 0 0 0-7-7z"/><path d="M8.500 12a3.500 4 0 0 1 7 0"/>',
  alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4.500M12 17.500h.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
};
const ic=(k,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${P[k]||''}</svg>`;

/* ---------- погода по коду ---------- */
function wx(code,day=1){
  const d=!!day;
  if(code===0)return{t:'Ясно',k:d?'sun':'moon',f:'clear'};
  if(code===1)return{t:'Почти ясно',k:d?'sun':'moon',f:'clear'};
  if(code===2)return{t:'Переменная облачность',k:d?'pcloudD':'pcloudN',f:'pcloud'};
  if(code===3)return{t:'Пасмурно',k:'cloud',f:'cloud'};
  if(code===45||code===48)return{t:'Туман',k:'fog',f:'fog'};
  if(code>=51&&code<=55)return{t:'Морось',k:'rain',f:'rain'};
  if(code===56||code===57)return{t:'Ледяная морось',k:'rain',f:'rain'};
  if(code===61)return{t:'Небольшой дождь',k:'rain',f:'rain'};
  if(code===63)return{t:'Дождь',k:'rain',f:'rain'};
  if(code===65)return{t:'Сильный дождь',k:'rain',f:'rain'};

function ctx(){
  const off=W.utc_offset_seconds*1000, now=Date.now()+off;
  const H=W.hourly, T=H.time.map(parse);
  let i=0;for(let k=0;k<T.length;k++){if(T[k]<=now)i=k;else break}
  return{now,H,T,i,off};
}
function hoursOf(c,dayShift,from,to){
  const base=new Date(c.now);base.setUTCHours(0,0,0,0);
  const out=[];
  for(let k=0;k<c.T.length;k++){
    const d=new Date(c.T[k]);
    const dd=Math.round((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-base.getTime())/864e5);
    if(dd===dayShift&&d.getUTCHours()>=from&&d.getUTCHours()<=to)out.push(k);
  }
  return out;
}
function slice(idx){
  const c=ctx(),H=c.H;
  if(!idx.length)idx=[c.i];
  const g=a=>idx.map(k=>H[a][k]);
  const mid=idx[idx.length>>1];
  return{
    feels:Math.min(...g('apparent_temperature')),fa:avg(g('apparent_temperature')),
    temp:Math.min(...g('temperature_2m')),ta:avg(g('temperature_2m')),
    wind:Math.max(...g('wind_speed_10m')),
    pop:Math.max(...g('precipitation_probability').map(v=>v??0)),
    pr:Math.max(...g('precipitation').map(v=>v??0)),

}

}

  if(t<=-6&&!soak){
    outer=DOWN;head=t<=-18?'Пуховик и всё тёплое':'Пуховик Karl Lagerfeld';
    mid=t<=-15?['sweater','Термобельё и тёплая кофта','Два слоя под пуховик']:['sweater','Тёплая кофта или флис','Под пуховик'];

  }else if(t<=2){
    outer=ARC('Ветер не продует');mid=['sweater','Тёплая кофта или флис','Под ветровку'];bottom=['pants','Штаны потеплее','Джинсы пойдут, если недолго'];head="Ветровка Arc'teryx и тёплая кофта";
  }else if(t<=9){
    outer=ARC('');mid=['sweater','Кофта','Под ветровку'];bottom=['pants','Джинсы или брюки',''];head="Ветровка Arc'teryx и кофта";
  }else if(t<=15){
    outer=ARC('Можно расстегнуть');mid=['sweater','Лонгслив или тонкая кофта',''];bottom=['pants','Джинсы или брюки',''];head="Ветровка Arc'teryx";
  }else if(t<=20){
    if(w>7)outer=ARC('Ветер сильный');
    mid=['sweater','Худи или рубашка',''];bottom=['pants','Джинсы или брюки',''];head=w>7?"Кофта и ветровка Arc'teryx":'Кофта или худи';
  }else if(t<=24){
    mid=['tee','Футболка','Можно с рубашкой'];bottom=['pants','Лёгкие брюки',''];head='Футболка и лёгкие вещи';
  }else{
    mid=['tee','Футболка','Лучше светлая'];bottom=['shorts','Шорты','Или лёгкие брюки'];head='Футболка и ничего лишнего';
  }
  if(t<=-6||(snowy&&t<=2))shoes=['boot','Зимние ботинки','С толстой подошвой'];
  else if(t<=3)shoes=['boot','Утеплённые ботинки','Тёплые носки'];
  else if(t<=10)shoes=['boot','Ботинки',''];
  else shoes=soak?['sneaker','Обувь, которую не жалко','Или непромокаемая']:['sneaker','Кроссовки',''];
  const items=[];if(outer)items.push(outer);items.push(mid,bottom,shoes);
  if(t<=-5)items.push(['hat','Тёплая шапка','Уши закрыть']);else if(t<=4)items.push(['hat','Шапка','Тонкая подойдёт']);
  if(t<=-10)items.push(['mitten','Варежки','Теплее перчаток']);else if(t<=0)items.push(['mitten','Перчатки','']);

  return{head,items,soak};
}

  let nowG='';
  if(period===0){const nh=(c.now-c.T[ix[0]])/3600e3,x=X(Math.max(0,Math.min(24,nh))),y=Y(T[Math.min(23,Math.floor(nh))]+(T[Math.min(24,Math.ceil(nh))]-T[Math.min(23,Math.floor(nh))])*(nh%1));
    nowG=`<line x1="${x}" y1="30" x2="${x}" y2="${yBase}" stroke="rgba(255,255,255,.5)" stroke-width="1"/><circle cx="${x}" cy="${y}" r="9" fill="#fff" opacity=".18"><animate attributeName="r" values="6;12;6" dur="3s" repeatCount="indefinite"/></circle><circle cx="${x}" cy="${y}" r="3.6" fill="#fff"/>`}
  const ax=[0,6,12,18,24].map(h=>`<text x="${X(h)}" y="196" text-anchor="${h===0?'start':h===24?'end':'middle'}" class="ct3">${String(h).padStart(2,'0')}</text>`).join('');
  $('#chart').innerHTML=`<svg viewBox="0 0 ${VW} 202" id="csvg">
    <defs><filter id="bl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter><linearGradient id="cg" gradientUnits="userSpaceOnUse" x1="${pl}" x2="${VW-pr}" y1="0" y2="0">${stops}</linearGradient>
    <linearGradient id="vg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="am"><rect x="0" y="0" width="${VW}" height="${yBase}" fill="url(#vg)"/></mask></defs>
    <g filter="url(#bl)" opacity=".9"><rect x="${X(0)-20}" y="26" width="${Math.max(0,X(sr)-X(0))+20}" height="${yBase-26}" fill="rgba(0,0,0,.38)"/><rect x="${X(ss)}" y="26" width="${Math.max(0,X(24)-X(ss))+20}" height="${yBase-26}" fill="rgba(0,0,0,.38)"/></g>
    <text x="${X(sr)}" y="20" text-anchor="middle" class="ct3">${hhmm(D.sunrise[period])}</text><text x="${X(ss)}" y="20" text-anchor="middle" class="ct3">${hhmm(D.sunset[period])}</text>
    <path d="${area}" fill="url(#cg)" opacity=".26" mask="url(#am)" class="carea"/>
    ${popBars}
    <path d="${d}" fill="none" stroke="url(#cg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="cline"/>
    ${mark(8,'выход')}${mark(19,'домой')}${nowG}${ax}
    <g id="scrub" style="opacity:0"><line id="sl" y1="30" y2="${yBase}" stroke="#fff" stroke-opacity=".6"/><circle id="sd" r="4.5" fill="#fff"/></g>
    <rect id="hit" x="0" y="0" width="${VW}" height="202" fill="transparent"/></svg>`;
  chartPts={pts,idx,T,ix,H,X};
  $('#chartRead').textContent=`от ${fmt(mn)} до ${fmt(mx)}`;
  const svg=$('#csvg');
  const mv=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW,h=Math.max(0,Math.min(23,Math.round((x-pl)/(VW-pl-pr)*24)));
    const[px,py]=chartPts.pts[h],k=chartPts.ix[h];
    $('#sl').setAttribute('x1',px);$('#sl').setAttribute('x2',px);$('#sd').setAttribute('cx',px);$('#sd').setAttribute('cy',py);$('#scrub').style.opacity=1;
    const pop=chartPts.H.precipitation_probability[k]||0;
    $('#chartRead').textContent=`${String(h).padStart(2,'0')}:00 · ${fmt(chartPts.T[h])}${pop>=30?` · осадки ${Math.round(pop)}%`:''}`};
  const out=()=>{$('#scrub').style.opacity=0;$('#chartRead').textContent=`от ${fmt(mn)} до ${fmt(mx)}`};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',out);
  svg.addEventListener('pointerup',e=>{if(e.pointerType==='touch')setTimeout(out,1400)});
}

/* ---------- неделя ---------- */
function renderDays(){
  const D=W.daily,gmn=Math.min(...D.temperature_2m_min),gmx=Math.max(...D.temperature_2m_max),sp=(gmx-gmn)||1,g=grad(gmn,gmx);
  $('#days').innerHTML=D.time.map((s,i)=>{
    const dt=new Date(s+'T00:00:00Z'),nm=i===0?'Сегодня':i===1?'Завтра':WDs[dt.getUTCDay()].replace(/^./,m=>m.toUpperCase());
    const wv=wx(D.weather_code[i],1),lo=D.temperature_2m_min[i],hi=D.temperature_2m_max[i];
    const l=(lo-gmn)/sp*100,wd=Math.max(6,(hi-lo)/sp*100),pop=D.precipitation_probability_max[i],bs=100/wd*100,bp=wd>=100?0:l/(100-wd)*100;
    return`<div class="day"><div class="dn">${nm}</div><div class="di">${ic(wv.k,'ico')}</div>
    <div class="dbar"><span class="n">${fmt(lo)}</span><span class="dtrack"><span class="dfill" style="left:${l}%;width:${wd}%;background:${g};background-size:${bs}% 100%;background-position:${bp}% 0;transition-delay:${i*90}ms"></span></span><span class="x">${fmt(hi)}</span></div><div class="dpop">${pop>=30?pop+'%':''}</div></div>`;
  }).join('');
}

/* ---------- мелочи дня ---------- */
function renderDetails(){
  const D=W.daily,c=ctx(),ix=hoursOf(c,period,0,23),H=W.hourly;
  const wind=Math.max(...ix.map(k=>H.wind_speed_10m[k])),pr=D.precipitation_sum[period],uv=D.uv_index_max[period];
  const uvT=uv<3?'низкий':uv<6?'умеренный':uv<8?'высокий':'очень высокий';
  const dl=D.daylight_duration[period]/3600,h=Math.floor(dl),m=Math.round((dl-h)*60);
  let air=['Светлый день',`${h} ч ${m} мин`];
  if(period===0&&AQ&&AQ.current){const a=AQ.current.european_aqi;air=['Воздух',a<=20?'отличный':a<=40?'хороший':a<=60?'умеренный':a<=80?'плохой':'очень плохой']}
  const cell=(k,v,u)=>`<div class="fig"><div class="k">${k}</div><div class="v">${v}${u?`<small>${u}</small>`:''}</div></div>`;
  $('#detBox').innerHTML=cell('Ветер',Math.round(wind),'м/с')+cell('Осадки',pr<0.1?'нет':pr.toFixed(1),pr<0.1?'':'мм')+cell('УФ',Math.round(uv),uvT)+cell(air[0],air[1],'');
}

/* ---------- сверка ---------- */
function renderTrust(){
  const m=W.meta,el=$('#trustTxt');if(!m||m.n<2){el.textContent='Источник один';return}
  const ds=avg(hoursOf(ctx(),period,7,22).map(k=>m.spread[k]))||0;
  const lv=ds<=2.5?['g','сходятся']:ds<=4.5?['w','немного расходятся']:['r','сильно расходятся'];
  el.innerHTML=`<span class="st ${lv[0]==='g'?'':lv[0]}"></span>${m.n} источников, ${lv[1]}`;
}
function renderSrcs(){
  renderTrust();
  const m=W.meta,box=$('#srcBox'),c=ctx();
  if(!m||m.n<2){box.innerHTML='';return}
  const ix=hoursOf(c,period,0,23),T=W.hourly.temperature_2m;
  const rows=[['Итог','среднее',Math.min(...ix.map(i=>T[i])),Math.max(...ix.map(i=>T[i])),1]];
  m.names.forEach(n=>{const v=ix.map(i=>m.srcT[n][i]).filter(x=>x!=null);if(!v.length)return;rows.push([n==='metno'?'MET Norway':MODELS[n],n==='metno'?'Норвегия':MNAME[n],Math.min(...v),Math.max(...v),0])});
  const gmn=Math.min(...rows.map(r=>r[2])),gmx=Math.max(...rows.map(r=>r[3])),sp=(gmx-gmn)||1,g=grad(gmn,gmx);
  box.innerHTML=rows.map((r,k)=>{
    const l=(r[2]-gmn)/sp*100,w=Math.max(5,(r[3]-r[2])/sp*100),bs=100/w*100,bp=w>=100?0:l/(100-w)*100;
    return`<div class="srow ${r[4]?'main':''}"><div class="nm">${r[0]}<small>${r[1]}</small></div><div class="dbar"><span class="n">${fmt(r[2])}</span><span class="dtrack"><span class="dfill go" style="left:${l}%;width:${w}%;background:${g};background-size:${bs}% 100%;background-position:${bp}% 0"></span></span><span class="x">${fmt(r[3])}</span></div></div>`}).join('');
}

/* ---------- отрисовка ---------- */
function count(el,to){
  if(RM){el.firstChild.nodeValue=to;return}
  const from=parseInt(el.dataset.v||'0',10)||0,t0=performance.now(),D=1300;
  const step=t=>{const f=Math.min(1,(t-t0)/D),e=1-Math.pow(1-f,4);el.firstChild.nodeValue=Math.round(from+(to-from)*e);if(f<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);el.dataset.v=to;
}
function render(first){
  const cur=W.current,D=W.daily;
  const w=wx(cur.weather_code,cur.is_day);
  const th=w.f==='clear'?(cur.is_day?'clearD':'clearN'):w.f==='pcloud'?(cur.is_day?'pcloudD':'pcloudN'):w.f;
  const T=THEMES[th]||THEMES.cloud,r=document.documentElement.style;
  r.setProperty('--a',T[0]);r.setProperty('--b',T[1]);r.setProperty('--c',T[2]);
  FX.set(w.f,cur.is_day,cur.weather_code,cur.wind_speed_10m);
  $('#hero').classList.remove('sk');
  const now=new Date();
  $('#date').textContent=new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'}).format(now);
  const tEl=$('#temp');if(!tEl.firstChild||tEl.firstChild.nodeType!==3)tEl.innerHTML='0<sup>°</sup>';
  count(tEl,num(cur.temperature_2m));
  $('#cond').innerHTML=ic(w.k)+'<span>'+w.t+'</span>';
  $('#feels').textContent=`Ощущается как ${fmt(cur.apparent_temperature)}`;
  const lo=D.temperature_2m_min[0],hi=D.temperature_2m_max[0];
  $('#lo').textContent=fmt(lo);$('#hi').textContent=fmt(hi);
  const rf=$('#rfill');rf.style.background=grad(lo,hi);
  $('#rdot').style.left=(Math.max(0,Math.min(1,(cur.temperature_2m-lo)/((hi-lo)||1)))*100)+'%';
  setTimeout(()=>rf.classList.add('go'),50);
  moveSeg();renderOutfit(first);renderChart();renderDays();renderDetails();renderSrcs();
  $('#foot').textContent=`Обновлено ${new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).format(updated)}`;
  observe();
}
let io;
function observe(){
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
  let n=0;document.querySelectorAll('.reveal:not(.in)').forEach(el=>{setTimeout(()=>io.observe(el),n*110);n++});
}
document.addEventListener('pointermove',e=>{
  const g=e.target.closest&&e.target.closest('.glass');
  document.querySelectorAll('.glass.lit').forEach(x=>{if(x!==g)x.classList.remove('lit')});
  if(!g)return;const r=g.getBoundingClientRect();
  g.style.setProperty('--x',(e.clientX-r.left)+'px');g.style.setProperty('--y',(e.clientY-r.top)+'px');g.classList.add('lit');
},{passive:true});

/* ---------- эффекты фона: снег, дождь, звёзды ---------- */
const FX=(()=>{
  const cv=$('#fx'),cx=cv.getContext('2d'),fl=$('#flash');
  let w=0,h=0,dpr=1,mode='none',parts=[],wind=0,raf=0,night=false,boltT=0;
  function size(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;cx.setTransform(dpr,0,0,dpr,0,0);seed()}
  function seed(){
    parts=[];let n=0;
    if(mode==='snow')n=Math.round(w*h/9000);
    else if(mode==='rain')n=Math.round(w*h/5500);
    else if(mode==='stars')n=Math.round(w*h/9000);
    for(let i=0;i<n;i++)parts.push(mk(true));
  }
  function mk(init){
    if(mode==='snow')return{x:Math.random()*w,y:init?Math.random()*h:-10,r:.8+Math.random()*2.4,v:.4+Math.random()*1.1,ph:Math.random()*6.28,o:.35+Math.random()*.55};
    if(mode==='rain')return{x:Math.random()*w,y:init?Math.random()*h:-30,l:10+Math.random()*16,v:11+Math.random()*9,o:.12+Math.random()*.3};
    return{x:Math.random()*w,y:Math.random()*h*.8,r:.4+Math.random()*1.2,ph:Math.random()*6.28,sp:.4+Math.random()*1.4};
  }
  function frame(t){
    raf=requestAnimationFrame(frame);
    cx.clearRect(0,0,w,h);
    if(mode==='snow'){
      for(const p of parts){p.y+=p.v;p.x+=Math.sin(t/1200+p.ph)*.5+wind*.35;
        if(p.y>h+10||p.x>w+20||p.x<-20){Object.assign(p,mk(false));if(p.x>w||p.x<0)p.x=Math.random()*w}
        cx.beginPath();cx.fillStyle=`rgba(235,244,255,${p.o})`;cx.shadowColor='rgba(200,225,255,.6)';cx.shadowBlur=p.r*3;cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
      cx.shadowBlur=0;
    }else if(mode==='rain'){
      cx.lineWidth=1.1;cx.lineCap='round';const dx=2+wind*.6;
      for(const p of parts){p.y+=p.v;p.x+=dx*p.v/10;
        if(p.y>h){Object.assign(p,mk(false))}
        cx.strokeStyle=`rgba(190,225,255,${p.o})`;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-dx*p.l/10,p.y-p.l);cx.stroke()}
    }else if(mode==='stars'){
      for(const p of parts){const a=.25+.75*Math.abs(Math.sin(t/1000*p.sp+p.ph));cx.beginPath();cx.fillStyle=`rgba(255,255,255,${a*.8})`;cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
    }
    if(boltT&&t>boltT){boltT=0;lightning()}
  }
  function lightning(){
    fl.animate([{opacity:0},{opacity:.35},{opacity:.05},{opacity:.28},{opacity:0}],{duration:620,easing:'ease-out'});
    if(document.visibilityState==='visible')boltT=performance.now()+6000+Math.random()*9000;
  }
  function set(f,isDay,code,ws){
    let m='none';
    if(f==='snow')m='snow';else if(f==='rain'||f==='storm')m='rain';else if(!isDay&&(f==='clear'||f==='pcloud'))m='stars';
    wind=Math.min(6,(ws||0)*.5);
    if(RM)m='none';
    if(m!==mode){mode=m;seed()}
    boltT=f==='storm'&&!RM?performance.now()+2500:0;
    if(!raf)raf=requestAnimationFrame(frame);
  }
  addEventListener('resize',size);size();
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else if(!raf)raf=requestAnimationFrame(frame)});
  return{set};
})();

/* ---------- запуск ---------- */
$('#refresh').addEventListener('click',()=>load(true));
$('#retry').addEventListener('click',()=>load(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-updated>10*60e3)load()});
setInterval(()=>{if(!document.hidden&&Date.now()-updated>15*60e3)load()},60e3);
{const hh=+new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',hour12:false}).format(new Date());if(hh>=21){period=1;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x.dataset.p==='1'))}}
try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s&&s.W&&s.W.meta&&Date.now()-s.updated<12*3600e3){W=s.W;AQ=s.AQ;updated=s.updated;render(true)}
}catch(e){}
load();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
