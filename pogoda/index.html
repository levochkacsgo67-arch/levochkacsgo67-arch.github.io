<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Погода · Южно-Сахалинск</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Погода">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#05070b;
  --ink:#f5f7fa;
  --ink2:rgba(245,247,250,.64);
  --ink3:rgba(245,247,250,.38);
  --line:rgba(255,255,255,.09);
  --a:#1d4f9c; --b:#0d2a5c; --c:#3a7bd5;
  --r:30px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}

/* ---------- фон ---------- */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.04),transparent 60%),var(--bg)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform;transition:background-color 2.4s ease}
.blob.b1{width:80vmax;height:80vmax;left:-30vmax;top:-34vmax;background:var(--a);animation:drift1 38s ease-in-out infinite alternate}
.blob.b2{width:70vmax;height:70vmax;right:-34vmax;top:18vh;background:var(--b);opacity:.8;animation:drift2 46s ease-in-out infinite alternate}
.blob.b3{width:50vmax;height:50vmax;left:10vmax;bottom:-30vmax;background:var(--c);opacity:.32;animation:drift3 52s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(14vmax,10vmax,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-16vmax,-8vmax,0) scale(.9)}}
@keyframes drift3{to{transform:translate3d(12vmax,-12vmax,0) scale(1.2)}}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.55) 100%);pointer-events:none}
#fx{position:absolute;inset:0;width:100%;height:100%}
.flash{position:absolute;inset:0;background:#cfd8ff;opacity:0;pointer-events:none;mix-blend-mode:screen}

/* ---------- жидкое стекло ---------- */
.glass{position:relative;border-radius:var(--r);isolation:isolate;
  background:linear-gradient(145deg,rgba(255,255,255,.115) 0%,rgba(255,255,255,.035) 46%,rgba(255,255,255,.06) 100%);
  -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(.92);backdrop-filter:blur(26px) saturate(190%) brightness(.92);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.26),
    inset 0 -1px 0 rgba(255,255,255,.05),
    inset 1px 0 0 rgba(255,255,255,.07),
    inset 0 0 28px rgba(255,255,255,.035),
    0 1px 2px rgba(0,0,0,.3),
    0 18px 44px -12px rgba(0,0,0,.55);
  transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.06) 28%,rgba(255,255,255,0) 52%,rgba(255,255,255,.14) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;opacity:0;transition:opacity .5s ease;
  background:radial-gradient(260px circle at var(--x,50%) var(--y,0%),rgba(255,255,255,.16),transparent 62%)}
.glass.lit::after{opacity:1}
.pad{padding:22px}
.label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:0 0 16px}
.label svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- каркас ---------- */
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px)}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1020px){
  .app{max-width:1120px}
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:16px}
  .span2{grid-column:1/-1}
}
.reveal{opacity:0;transform:translateY(26px) scale(.985);filter:blur(10px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}
.reveal.in{opacity:1;transform:none;filter:none}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.city{display:flex;align-items:center;gap:8px;padding:9px 15px 9px 12px;border-radius:99px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.city svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.refresh{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.refresh svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .8s var(--ease)}
.refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh:active,.seg button:active,.city:active{transform:scale(.94)}

/* ---------- главный экран ---------- */
.hero{text-align:center;padding:26px 8px 10px;position:relative}
.date{font-size:15px;color:var(--ink2);letter-spacing:.01em;text-transform:capitalize}
.hero-ico{width:86px;height:86px;margin:14px auto 0;filter:drop-shadow(0 8px 30px var(--glow,rgba(120,170,255,.35)))}
.temp{font-size:clamp(104px,30vw,148px);font-weight:200;letter-spacing:-.055em;line-height:.95;margin:2px 0 0;padding-left:.12em;
  background:linear-gradient(180deg,#fff 20%,rgba(255,255,255,.62));-webkit-background-clip:text;background-clip:text;color:transparent}
.temp sup{font-size:.42em;font-weight:200;vertical-align:top;position:relative;top:.12em;margin-left:.02em;letter-spacing:0}
.cond{font-size:22px;font-weight:500;letter-spacing:-.015em;margin-top:6px}
.feels{font-size:15px;color:var(--ink2);margin-top:4px}
.range{display:flex;align-items:center;gap:12px;max-width:340px;margin:26px auto 0;padding:13px 18px;border-radius:99px;font-size:15px;font-weight:600}
.range .lo,.range .hi{min-width:44px}
.range .lo{text-align:right;color:var(--ink2)}
.rtrack{position:relative;flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.12)}
.rfill{position:absolute;top:0;bottom:0;border-radius:9px;transform-origin:left;transform:scaleX(0);transition:transform 1.4s var(--ease) .5s}
.in .rfill,.rfill.go{transform:scaleX(1)}
.rdot{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 3px rgba(5,7,11,.55),0 0 14px rgba(255,255,255,.7);transition:left 1.4s var(--ease) .5s;left:0}
.range-cap{font-size:12px;color:var(--ink3);margin-top:9px;letter-spacing:.02em}

/* ---------- одежда ---------- */
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:99px;margin-bottom:20px;
  background:rgba(255,255,255,.06);box-shadow:inset 0 1px 2px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.06)}
.seg button{position:relative;z-index:1;padding:9px 0;font-size:13.5px;font-weight:600;color:var(--ink2);border-radius:99px;transition:color .35s ease,transform .3s var(--ease)}
.seg button.on{color:#fff}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:99px;transition:transform .55s var(--ease);
  background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.35)}
.verdict{font-size:clamp(25px,6.6vw,31px);font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:0}
.vsub{font-size:14.5px;color:var(--ink2);margin:8px 0 18px;line-height:1.4}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{display:flex;gap:12px;align-items:center;padding:13px;border-radius:20px;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.11);
  opacity:0;transform:translateY(10px);animation:itIn .7s var(--ease) forwards}
@keyframes itIn{to{opacity:1;transform:none}}
.it .ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.it svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.it b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.it span{display:block;font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.25}
.tip{margin-top:14px;padding:13px 15px;border-radius:18px;font-size:13.5px;line-height:1.4;color:var(--ink2);background:rgba(255,255,255,.045);display:flex;gap:11px;align-items:flex-start}
.tip svg{flex:none;width:18px;height:18px;margin-top:1px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tip b{color:var(--ink);font-weight:600}

/* ---------- по часам ---------- */
.hours{overflow-x:auto;margin:0 -22px;padding:0 22px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hours::-webkit-scrollbar{display:none}
.hrow{position:relative;display:flex}
.hc{flex:none;width:58px;display:grid;grid-template-rows:20px 34px 78px 24px 16px;justify-items:center;text-align:center;font-size:14px;font-weight:600}
.hc .t{font-size:12.5px;color:var(--ink2);font-weight:500;align-self:center}
.hc.now .t{color:#fff;font-weight:700}
.hc .ico{width:26px;height:26px;align-self:center}
.hc .pop{font-size:11.5px;color:#7cc4ff;font-weight:600}
.hsvg{position:absolute;left:0;top:54px;height:78px;pointer-events:none;overflow:visible}
.hpath{fill:none;stroke:url(#hg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 2.2s var(--ease) .3s}
.in .hpath,.go .hpath{stroke-dashoffset:0}
.hdot{fill:#fff;stroke:rgba(5,7,11,.6);stroke-width:2}

/* ---------- 7 дней ---------- */
.day{display:grid;grid-template-columns:76px 30px 1fr;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line);font-size:16px;font-weight:600}
.day:first-of-type{border-top:0;padding-top:0}
.day:last-child{padding-bottom:0}
.day .dn{letter-spacing:-.01em}
.day .dn small{display:block;font-size:12px;color:var(--ink3);font-weight:500;margin-top:1px}
.day .ico{width:26px;height:26px}
.dbar{display:flex;align-items:center;gap:10px}
.dbar .n{width:34px;text-align:right;color:var(--ink2);font-weight:500}
.dbar .x{width:34px}
.dtrack{position:relative;flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.1)}
.dfill{position:absolute;top:0;bottom:0;border-radius:9px;transform-origin:left;transform:scaleX(0);transition:transform 1.2s var(--ease)}
.in .dfill,.go .dfill{transform:scaleX(1)}
.dpop{font-size:11.5px;color:#7cc4ff;font-weight:600;margin-left:2px}

/* ---------- дорога ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{padding:16px;border-radius:22px;background:rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.mini .k{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.mini .v{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:8px 0 4px;line-height:1.15}
.mini .d{font-size:12.5px;color:var(--ink2);line-height:1.35}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:#5fe3a1;box-shadow:0 0 10px #5fe3a1}
.st.w{background:#ffd166;box-shadow:0 0 10px #ffd166}
.st.r{background:#ff6b6b;box-shadow:0 0 10px #ff6b6b}

/* ---------- параметры ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:16px;border-radius:22px;background:rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);min-height:128px;display:flex;flex-direction:column}
.stat .k{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.stat .k svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat .v{font-size:30px;font-weight:300;letter-spacing:-.03em;margin:10px 0 0;line-height:1}
.stat .v small{font-size:14px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:3px}
.stat .d{font-size:12.5px;color:var(--ink2);margin-top:auto;padding-top:8px;line-height:1.3}
.meter{height:5px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:12px;position:relative;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;width:0;transition:width 1.4s var(--ease) .4s}
.compass{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;background:rgba(0,0,0,.18)}
.compass svg{width:30px;height:30px;transition:transform 1.6s var(--ease) .4s;transform:rotate(0deg)}
.stat{position:relative}

/* ---------- солнце ---------- */
.sun{position:relative}
.sun #sunBox svg{width:100%;height:auto;overflow:visible}
.sun-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:2px}
.sun-meta b{display:block;color:var(--ink);font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:2px}
.sun-meta div:last-child{text-align:right}
.sun-meta div:nth-child(2){text-align:center}
.sarc{fill:none;stroke:rgba(255,255,255,.14);stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round}
.sarc2{fill:none;stroke:url(#sg);stroke-width:3;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 2.4s var(--ease) .3s}
.in .sarc2,.go .sarc2{stroke-dashoffset:0}

/* ---------- прочее ---------- */
.foot{text-align:center;color:var(--ink3);font-size:12.5px;margin-top:22px;line-height:1.6}
.err{display:none;margin:12px 0;padding:14px 16px;border-radius:20px;font-size:14px;color:#ffd0d0;background:rgba(255,80,80,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.err.show{display:block}
.err button{margin-left:6px;text-decoration:underline;font-weight:600}
.sk .temp,.sk .cond,.sk .feels{opacity:.35;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.15}}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5fe3a1;margin-right:7px;vertical-align:1px;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{opacity:1;transform:none;filter:none}
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>
  <div class="grain"></div><div class="vignette"></div>
</div>

<!-- SVG-спрайт значков -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="hg" x1="0" x2="1"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#ffb067"/><stop offset="1" stop-color="#ffe9a8"/></linearGradient>
  </defs>
</svg>

<main class="app" id="app">
  <div class="top">
    <div class="glass city"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11.2A7 7 0 0 0 5 9.8C5 15.4 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.4"/></svg>Южно-Сахалинск</div>
    <button class="glass refresh" id="refresh" aria-label="Обновить"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </div>

  <div class="err" id="err">Не получилось загрузить погоду. <button id="retry">Ещё раз</button></div>

  <section class="hero sk" id="hero">
    <div class="date" id="date">&nbsp;</div>
    <div class="hero-ico" id="heroIco"></div>
    <div class="temp" id="temp">--<sup>°</sup></div>
    <div class="cond" id="cond">Загружаю</div>
    <div class="feels" id="feels">&nbsp;</div>
    <div class="glass range" id="range">
      <span class="lo" id="lo">--°</span>
      <span class="rtrack"><span class="rfill" id="rfill"></span><span class="rdot" id="rdot"></span></span>
      <span class="hi" id="hi">--°</span>
    </div>
    <div class="range-cap">сегодня от и до</div>
  </section>

  <div class="grid" id="grid">

    <section class="glass pad reveal" id="outfit">
      <h3 class="label"><svg viewBox="0 0 24 24"><path d="M8 4L3 7l2 4 3-1v10h8V10l3 1 2-4-5-3a4 4 0 0 1-8 0z"/></svg>Что надеть</h3>
      <div class="seg" id="seg"><i></i>
        <button data-p="now" class="on">Сейчас</button><button data-p="day">Днём</button><button data-p="eve">Вечером</button><button data-p="tom">Завтра</button>
      </div>
      <h2 class="verdict" id="verdict"></h2>
      <p class="vsub" id="vsub"></p>
      <div class="items" id="items"></div>
      <div class="tip" id="tip" style="display:none"></div>
    </section>

    <section class="glass pad reveal" id="hourly">
      <h3 class="label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Ближайшие 24 часа</h3>
      <div class="hours"><div class="hrow" id="hrow"></div></div>
    </section>

    <section class="glass pad reveal" id="road">
      <h3 class="label"><svg viewBox="0 0 24 24"><path d="M5 17h14M6 17l1.4-5.2A2 2 0 0 1 9.3 10h5.4a2 2 0 0 1 1.9 1.8L18 17M6 17v2M18 17v2M8.5 14h.01M15.5 14h.01"/></svg>Дорога и машина</h3>
      <div class="two" id="roadBox"></div>
    </section>

    <section class="glass pad reveal" id="daily">
      <h3 class="label"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Неделя</h3>
      <div id="days"></div>
    </section>

    <section class="glass pad reveal" id="stats">
      <h3 class="label"><svg viewBox="0 0 24 24"><path d="M4 8h10a3 3 0 1 0-3-3M4 13h14a3 3 0 1 1-3 3M4 18h7"/></svg>Подробности</h3>
      <div class="stats" id="statBox"></div>
    </section>

    <section class="glass pad reveal sun" id="sun">
      <h3 class="label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>Солнце</h3>
      <div id="sunBox"></div>
    </section>

    <section class="glass pad reveal span2" id="air">
      <h3 class="label"><svg viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 14h15a3 3 0 1 1-3 3M3 19h7"/></svg>Воздух</h3>
      <div id="airBox"></div>
    </section>

  </div>

  <div class="foot" id="foot"></div>
</main>

<script>
(()=>{

const LAT=46.9594, LON=142.7379, TZ='Asia/Sakhalin';

/* ---------- погода по коду ---------- */
function wx(code,day=1){
  const d=!!day;
  if(code===0)return{t:'Ясно',k:d?'sun':'moon',f:'clear'};
  if(code===1)return{t:'Почти ясно',k:d?'sun':'moon',f:'clear'};
  if(code===2)return{t:'Переменная облачность',k:d?'pcloudD':'pcloudN',f:'pcloud'};
  if(code===3)return{t:'Пасмурно',k:'cloud',f:'cloud'};
  if(code===45||code===48)return{t:'Туман',k:'fog',f:'fog'};
  if(code>=51&&code<=55)return{t:'Морось',k:'rain',f:'rain'};
  if(code===56||code===57)return{t:'Ледяная морось',k:'rain',f:'rain'};
  if(code===61)return{t:'Небольшой дождь',k:'rain',f:'rain'};
  if(code===63)return{t:'Дождь',k:'rain',f:'rain'};
  if(code===65)return{t:'Сильный дождь',k:'rain',f:'rain'};
  if(code===66||code===67)return{t:'Ледяной дождь',k:'rain',f:'rain'};
  if(code===71)return{t:'Небольшой снег',k:'snow',f:'snow'};
  if(code===73)return{t:'Снег',k:'snow',f:'snow'};
  if(code===75)return{t:'Сильный снег',k:'snow',f:'snow'};
  if(code===77)return{t:'Снежная крупа',k:'snow',f:'snow'};
  if(code>=80&&code<=82)return{t:'Ливень',k:'rain',f:'rain'};
  if(code===85||code===86)return{t:'Снегопад',k:'snow',f:'snow'};
  if(code>=95)return{t:'Гроза',k:'storm',f:'storm'};
  return{t:'Облачно',k:'cloud',f:'cloud'};
}

const tcol=t=>{const S=[[-25,[110,168,255]],[-10,[127,209,255]],[0,[191,234,255]],[8,[158,240,200]],[16,[255,224,138]],[25,[255,176,103]],[33,[255,122,92]]];
  if(t<=S[0][0])return`rgb(${S[0][1]})`;for(let i=1;i<S.length;i++){if(t<=S[i][0]){const[a,ca]=S[i-1],[b,cb]=S[i],f=(t-a)/(b-a);return`rgb(${ca.map((v,j)=>Math.round(v+(cb[j]-v)*f))})`}}return`rgb(${S[S.length-1][1]})`};
const grad=(a,b)=>{const n=6,st=[];for(let i=0;i<=n;i++)st.push(tcol(a+(b-a)*i/n));return`linear-gradient(90deg,${st.join(',')})`};

async function load(manual){

/* ---------- расчёты по часам ---------- */
function ctx(){
  const off=W.utc_offset_seconds*1000, now=Date.now()+off;
  const H=W.hourly, T=H.time.map(parse);
  let i=0;for(let k=0;k<T.length;k++){if(T[k]<=now)i=k;else break}
  return{now,H,T,i,off};
}
function hoursOf(c,dayShift,from,to){ // часы по местному времени
  const base=new Date(c.now);base.setUTCHours(0,0,0,0);
  const out=[];
  for(let k=0;k<c.T.length;k++){
    const d=new Date(c.T[k]);
    const dd=Math.round((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-base.getTime())/864e5);
    if(dd===dayShift&&d.getUTCHours()>=from&&d.getUTCHours()<=to)out.push(k);
  }
  return out;
}
function slice(idx){
  const c=ctx(),H=c.H;
  if(!idx.length)idx=[c.i];
  const g=a=>idx.map(k=>H[a][k]);
  return{
    feels:Math.min(...g('apparent_temperature')),
    temp:Math.min(...g('temperature_2m')),
    wind:Math.max(...g('wind_speed_10m')),
    pop:Math.max(...g('precipitation_probability').map(v=>v??0)),
    pr:Math.max(...g('precipitation').map(v=>v??0)),
    snow:Math.max(...g('snowfall').map(v=>v??0))
  };
}
function periodData(p){
  const c=ctx(),cur=W.current;
  if(p==='now'){
    const k=c.i;
    return{feels:cur.apparent_temperature,temp:cur.temperature_2m,wind:cur.wind_speed_10m,pop:W.hourly.precipitation_probability[k]??0,pr:cur.precipitation,snow:W.hourly.snowfall[k]||0,label:'сейчас'};
  }
  if(p==='day')return{...slice(hoursOf(c,0,12,16)),label:'днём'};
  if(p==='eve')return{...slice(hoursOf(c,0,18,22)),label:'вечером'};
  return{...slice(hoursOf(c,1,7,9)),label:'завтра утром'};
}

/* ---------- что надеть ---------- */
function advise(d){
  const t=d.feels, w=d.wind;
  const wet=d.pop>=50||d.pr>0.2, snowy=(d.snow>0.1||(wet&&d.temp<=1));
  const rainy=wet&&!snowy;
  let head,outer=null,mid,bottom,shoes;
  if(t<=-20){head='Пуховик, термобельё и всё тёплое';outer=['puffer','Тёплый пуховик','Самый плотный, с капюшоном'];mid=['sweater','Термобельё и свитер','Два слоя под пуховик'];bottom=['pants','Утеплённые штаны','Лучше с термобельём']}
  else if(t<=-8){head='Пуховик и зимние ботинки';outer=['puffer','Пуховик','Застёгивай до горла'];mid=['sweater','Тёплый свитер','Или толстое худи'];bottom=['pants','Тёплые штаны','Не тонкие джинсы']}
  else if(t<=0){head='Куртка потеплее, кофта и шапка';outer=['puffer','Зимняя куртка','Или лёгкий пуховик'];mid=['sweater','Кофта или худи','Под куртку'];bottom=['pants','Штаны потеплее','Джинсы пойдут, если недолго']}
  else if(t<=7){head='Куртка и кофта';outer=['jacket','Куртка','Демисезонная'];mid=['sweater','Кофта или худи','Под куртку'];bottom=['pants','Джинсы или брюки','']}
  else if(t<=13){head='Лёгкая куртка';outer=['jacket','Лёгкая куртка','Или ветровка'];mid=['sweater','Лонгслив или кофта','Тонкий слой'];bottom=['pants','Джинсы или брюки','']}
  else if(t<=19){head=w>7?'Кофта и ветровка':'Кофта или худи';if(w>7)outer=['jacket','Ветровка','Ветер сильный, без неё продует'];mid=['sweater','Худи или рубашка','Хватит одного слоя'];bottom=['pants','Джинсы или брюки','']}
  else if(t<=24){head='Футболка и лёгкие вещи';mid=['tee','Футболка','Можно с рубашкой сверху'];bottom=['pants','Лёгкие брюки','Или джинсы']}
  else{head='Футболка и ничего лишнего';mid=['tee','Футболка','Лучше светлая, хлопок'];bottom=['shorts','Шорты','Или лёгкие брюки']}

  if(t<=-8||snowy&&t<=2)shoes=['boot','Зимние ботинки','На толстой подошве, с мехом'];
  else if(t<=3)shoes=['boot','Утеплённые ботинки','Сухие ноги, тёплые носки'];
  else if(t<=10)shoes=['boot','Ботинки','Кроссовки замёрзнут'];
  else shoes=rainy?['sneaker','Кроссовки, не жалко','Лучше непромокаемые']:['sneaker','Кроссовки','Подойдут любые'];

  const items=[];
  if(outer)items.push(outer);
  items.push(mid,bottom,shoes);
  if(t<=-5)items.push(['hat','Тёплая шапка','Уши закрыть обязательно']);
  else if(t<=4)items.push(['hat','Шапка','Хватит тонкой']);
  if(t<=-10)items.push(['mitten','Варежки','Теплее перчаток']);
  else if(t<=0)items.push(['mitten','Перчатки','']);
  if(t<=-3||(t<=6&&w>=8))items.push(['scarf','Шарф или бафф','Ветер - главный враг']);
  if(rainy)items.push(['umb','Зонт','Или дождевик']);
  else if(snowy&&t>-5)items.push(['hood','Капюшон','Мокрый снег']);

  const bits=[`Ощущается как ${fmt(t)}`];
  if(w>=1)bits.push(`ветер ${Math.round(w)} м/с`);
  if(rainy)bits.push('будет дождь');else if(snowy)bits.push('идёт снег');else if(d.pop>=30)bits.push(`осадки ${Math.round(d.pop)}%`);
  return{head,items,sub:bits.join(', ')};
}
function renderOutfit(animate=true){
  const d=periodData(period),a=advise(d);
  $('#verdict').textContent=a.head;
  $('#vsub').textContent=a.sub;
  const box=$('#items');box.innerHTML=a.items.map((it,n)=>`<div class="it" style="animation-delay:${animate?n*60:0}ms"><div class="ic">${ic(it[0])}</div><div><b>${it[1]}</b>${it[2]?`<span>${it[2]}</span>`:''}</div></div>`).join('');
  // подсказка: перепад в течение дня
  const c=ctx(),tip=$('#tip');
  const next=slice(hoursOf(c,0,c.i>=0?new Date(c.T[c.i]).getUTCHours():8,23));
  const cur=W.current.apparent_temperature;
  if(period==='now'&&next.feels<cur-4){
    const mi=hoursOf(c,0,new Date(c.T[c.i]).getUTCHours(),23).reduce((m,k)=>c.H.apparent_temperature[k]<c.H.apparent_temperature[m]?k:m,c.i);
    tip.style.display='flex';tip.innerHTML=`${ic('info')}<div><b>К вечеру холоднее.</b> Около ${hhmm(c.H.time[mi])} будет ${fmt(c.H.apparent_temperature[mi])}, одевайся с запасом.</div>`;
  }else if(period==='now'&&next.feels>cur+5){
    tip.style.display='flex';tip.innerHTML=`${ic('info')}<div><b>Днём потеплеет.</b> Одевайся слоями, чтобы можно было снять.</div>`;
  }else tip.style.display='none';
}

/* ---------- отрисовка ---------- */
function count(el,to){
  if(RM){el.firstChild.nodeValue=to;return}
  const from=parseInt(el.dataset.v||'0',10)||0,t0=performance.now(),D=1300;
  const step=t=>{const f=Math.min(1,(t-t0)/D),e=1-Math.pow(1-f,4);el.firstChild.nodeValue=Math.round(from+(to-from)*e);if(f<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);el.dataset.v=to;
}
function render(first){
  const cur=W.current,D=W.daily,c=ctx();
  const w=wx(cur.weather_code,cur.is_day);
  // тема
  let th=w.f==='clear'?(cur.is_day?'clearD':'clearN'):w.f==='pcloud'?(cur.is_day?'pcloudD':'pcloudN'):w.f;
  const T=THEMES[th]||THEMES.cloud,r=document.documentElement.style;
  r.setProperty('--a',T[0]);r.setProperty('--b',T[1]);r.setProperty('--c',T[2]);r.setProperty('--glow',GLOW[w.f]||GLOW.cloud);
  FX.set(w.f,cur.is_day,cur.weather_code,cur.wind_speed_10m);

  $('#heroIco').innerHTML=ic(w.k).replace('<svg','<svg style="width:86px;height:86px;stroke-width:1.1"');
  const tEl=$('#temp');if(!tEl.firstChild||tEl.firstChild.nodeType!==3)tEl.innerHTML='0<sup>°</sup>';
  count(tEl,num(cur.temperature_2m));
  $('#cond').textContent=w.t;
  $('#feels').textContent=`Ощущается как ${fmt(cur.apparent_temperature)}`;
  const lo=D.temperature_2m_min[0],hi=D.temperature_2m_max[0];
  $('#lo').textContent=fmt(lo);$('#hi').textContent=fmt(hi);
  const rf=$('#rfill');rf.style.left='0';rf.style.right='0';rf.style.background=grad(lo,hi);
  const pos=Math.max(0,Math.min(1,(cur.temperature_2m-lo)/((hi-lo)||1)));
  $('#rdot').style.left=(pos*100)+'%';
  setTimeout(()=>rf.classList.add('go'),50);

  moveSeg();renderOutfit(first);
  renderHourly(c);renderDays();renderRoad(c);renderStats(c);renderSun();renderAir();

  observe();
}

function renderHourly(c){
  const H=c.H,n=24,W_=58,idx=[];for(let k=c.i;k<c.i+n&&k<c.T.length;k++)idx.push(k);
  const ts=idx.map(k=>H.temperature_2m[k]),mn=Math.min(...ts),mx=Math.max(...ts),span=(mx-mn)||1;
  const Y=t=>10+(mx-t)/span*(58);
  const pts=idx.map((k,j)=>[j*W_+W_/2,Y(H.temperature_2m[k])]);
  // гладкая кривая
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let j=1;j<pts.length;j++){const[p0,p1]=[pts[j-1],pts[j]],cx=(p0[0]+p1[0])/2;d+=` C${cx},${p0[1]} ${cx},${p1[1]} ${p1[0]},${p1[1]}`}
  const len=Math.round(pts.length*W_*1.15);
  const cells=idx.map((k,j)=>{
    const wv=wx(H.weather_code[k],H.is_day[k]),pop=H.precipitation_probability[k];
    return`<div class="hc ${j===0?'now':''}"><div class="t">${j===0?'Сейчас':hhmm(H.time[k])}</div>${ic(wv.k,'ico')}<div></div><div>${fmt(H.temperature_2m[k])}</div><div class="pop">${pop>=20?pop+'%':''}</div></div>`;
  }).join('');
  $('#hrow').innerHTML=cells+`<svg class="hsvg" width="${pts.length*W_}" viewBox="0 0 ${pts.length*W_} 78"><path class="hpath" style="--len:${len}" d="${d}" pathLength="${len}"/>${pts.map(p=>`<circle class="hdot" cx="${p[0]}" cy="${p[1]}" r="3.4"/>`).join('')}</svg>`;
}

function renderDays(){
  const D=W.daily,gmn=Math.min(...D.temperature_2m_min),gmx=Math.max(...D.temperature_2m_max),sp=(gmx-gmn)||1;
  $('#days').innerHTML=D.time.map((s,i)=>{
    const dt=new Date(s+'T00:00:00Z'),nm=i===0?'Сегодня':i===1?'Завтра':WD[dt.getUTCDay()].slice(0,3).toLowerCase().replace(/^./,m=>m.toUpperCase());
    const wv=wx(D.weather_code[i],1),lo=D.temperature_2m_min[i],hi=D.temperature_2m_max[i];
    const l=(lo-gmn)/sp*100,wd=Math.max(6,(hi-lo)/sp*100),pop=D.precipitation_probability_max[i];
    const g=grad(gmn,gmx),bs=100/wd*100,bp=wd>=100?0:l/(100-wd)*100;
    return`<div class="day"><div class="dn">${nm}<small>${dt.getUTCDate()} ${['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][dt.getUTCMonth()]}</small></div><div>${ic(wv.k,'ico')}${pop>=30?`<div class="dpop">${pop}%</div>`:''}</div>
    <div class="dbar"><span class="n">${fmt(lo)}</span><span class="dtrack"><span class="dfill" style="left:${l}%;width:${wd}%;background:${g};background-size:${bs}% 100%;background-position:${bp}% 0;transition-delay:${i*90}ms"></span></span><span class="x">${fmt(hi)}</span></div></div>`;
  }).join('');
}

function renderRoad(c){
  const H=c.H,idx=[];for(let k=c.i;k<c.i+14&&k<c.T.length;k++)idx.push(k);
  let ice=null,watch=null;
  idx.forEach((k,j)=>{
    const t=H.temperature_2m[k],pr=H.precipitation[k]||0,prev=j?H.temperature_2m[idx[j-1]]:t;
    if(t<=1.5&&t>=-4&&(pr>0.05||(prev>0&&t<=0))&&!ice)ice=k;
    else if(t<=0.5&&t>=-6&&!watch)watch=k;
  });
  let road;
  if(ice!==null)road=['r','Возможен гололёд',`Около ${hhmm(H.time[ice])} температура у нуля и есть влага. Езжай аккуратно.`];
  else if(watch!==null&&H.precipitation.slice(Math.max(0,c.i-6),c.i+1).some(v=>v>0.1))road=['w','Мокрое подмерзает',`Лужи и мокрый асфальт могут схватиться льдом около ${hhmm(H.time[watch])}.`];
  else if(H.temperature_2m[c.i]<=-8)road=['w','Снег и накат',`Мороз ${fmt(H.temperature_2m[c.i])}, резина на морозе жёстче, тормозной путь длиннее.`];
  else road=['g','Дорога чистая','Льда не жду, осадков тоже.'];
  const D=W.daily,rainSum=[0,1,2].reduce((s,i)=>s+(D.precipitation_sum[i]||0),0),tmax=Math.max(D.temperature_2m_max[0],D.temperature_2m_max[1]);
  let wash;
  if(rainSum<0.5&&tmax>=1)wash=['g','Можно мыть','Три дня без осадков, плюс днём. Кузов останется чистым.'];
  else if(rainSum<0.5)wash=['w','Лучше подождать','Сухо, но мороз: замки и уплотнители замёрзнут.'];
  else wash=['r','Не стоит',`В ближайшие 3 дня около ${Math.round(rainSum)} мм осадков, помоешь зря.`];
  $('#roadBox').innerHTML=[['Дорога',road],['Мойка',wash]].map(([k,v])=>`<div class="mini"><div class="k">${k}</div><div class="v"><span class="st ${v[0]==='g'?'':v[0]}"></span>${v[1]}</div><div class="d">${v[2]}</div></div>`).join('');
}

function renderStats(c){
  const cur=W.current,H=W.hourly,k=c.i;
  const uv=H.uv_index[k]??0,uvT=uv<3?'Низкий':uv<6?'Умеренный':uv<8?'Высокий':'Очень высокий';
  const vis=(H.visibility[k]??10000)/1000,visT=vis>=10?'Отличная видимость':vis>=4?'Хорошая':vis>=1?'Плохая, туман или снег':'Почти ничего не видно';
  const mm=Math.round(cur.pressure_msl*0.750062),pT=mm<745?'Низкое':mm>765?'Высокое':'Нормальное';
  const dir=DIRS[Math.round(cur.wind_direction_10m/45)%8],g=cur.wind_gusts_10m;
  const hum=cur.relative_humidity_2m,hT=hum<30?'Сухо':hum<=60?'Комфортно':hum<=80?'Влажно':'Очень влажно';
  const pr=W.daily.precipitation_sum[0];
  const arrow=`<svg viewBox="0 0 30 30" style="transform:rotate(${(cur.wind_direction_10m+180)%360}deg)"><path d="M15 4v22M15 4l-5 6M15 4l5 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const S=(k,ico,v,u,d,m)=>`<div class="stat"><div class="k"><svg viewBox="0 0 24 24">${ico}</svg>${k}</div><div class="v">${v}<small>${u}</small></div>${m||''}<div class="d">${d}</div></div>`;
  $('#statBox').innerHTML=
   `<div class="stat"><div class="k"><svg viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 14h15a3 3 0 1 1-3 3"/></svg>Ветер</div><div class="v">${Math.round(cur.wind_speed_10m)}<small>м/с</small></div><div class="compass">${arrow}</div><div class="d">${dir}${g>cur.wind_speed_10m+2?`, порывы до ${Math.round(g)}`:''}</div></div>`
  +S('Влажность','<path d="M12 3s6 6.500 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z"/>',hum,'%',hT,`<div class="meter"><i data-w="${hum}" style="background:#7cc4ff"></i></div>`)
  +S('Давление','<circle cx="12" cy="12" r="9"/><path d="M12 12l4-4"/>',mm,'мм',pT+' для этого времени')
  +S('УФ-индекс','<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/>',Math.round(uv),'',uvT,`<div class="meter"><i data-w="${Math.min(100,uv/11*100)}" style="background:linear-gradient(90deg,#5fe3a1,#ffd166,#ff6b6b)"></i></div>`)
  +S('Видимость','<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',vis>=10?'10+':vis.toFixed(1),'км',visT)
  +S('Осадки','<path d="M7 15a4 4 0 0 1-.5-8 6 6 0 0 1 11.500 1.500A3.500 3.500 0 0 1 17.500 15z"/><path d="M9 18v2M13 18v2"/>',pr<0.1?'0':pr.toFixed(1),'мм','Всего за сегодня');
  setTimeout(()=>document.querySelectorAll('.meter i').forEach(i=>i.style.width=i.dataset.w+'%'),300);
  document.querySelectorAll('.compass svg').forEach(s=>{const t=s.style.transform;s.style.transform='rotate(0deg)';requestAnimationFrame(()=>requestAnimationFrame(()=>s.style.transform=t))});
}

function renderSun(){
  const D=W.daily,rise=parse(D.sunrise[0]),set=parse(D.sunset[0]),c=ctx(),now=c.now;
  const f=Math.max(0,Math.min(1,(now-rise)/(set-rise))),day=now>=rise&&now<=set;
  const R=120,cx=150,cy=140,ang=Math.PI*(1-f),x=cx+R*Math.cos(ang),y=cy-R*Math.sin(ang);
  const arc=`M${cx-R},${cy} A${R},${R} 0 0 1 ${cx+R},${cy}`,len=Math.round(Math.PI*R);
  const dl=D.daylight_duration[0]/3600,h=Math.floor(dl),m=Math.round((dl-h)*60);
  const tmr=parse(D.sunrise[1]),tmr0=parse(D.sunrise[0]),dd=(D.daylight_duration[1]-D.daylight_duration[0])/60;
  $('#sunBox').innerHTML=`<svg viewBox="0 0 300 160"><path class="sarc" d="${arc}"/><path class="sarc2" style="--len:${len}" d="M${cx-R},${cy} A${R},${R} 0 0 1 ${x},${y}" pathLength="${len}"/>
   <line x1="20" y1="${cy}" x2="280" y2="${cy}" stroke="rgba(255,255,255,.14)"/>
   <circle cx="${x}" cy="${y}" r="16" fill="${day?'#ffd98a':'#9fb0d8'}" opacity=".25"><animate attributeName="r" values="14;20;14" dur="4s" repeatCount="indefinite"/></circle>
   <circle cx="${x}" cy="${y}" r="7" fill="${day?'#fff3cf':'#dfe6f7'}"/></svg>
   <div class="sun-meta"><div><b>${hhmm(D.sunrise[0])}</b>восход</div><div><b>${h} ч ${m} мин</b>день${Math.abs(dd)>=0.5?` ${dd>0?'+':'-'}${Math.abs(dd).toFixed(0)} мин к завтра`:''}</div><div><b>${hhmm(D.sunset[0])}</b>закат</div></div>`;
}

function renderAir(){
  const box=$('#airBox');
  if(!AQ||!AQ.current){box.innerHTML='<div class="mini"><div class="d">Нет данных о воздухе</div></div>';return}
  const a=AQ.current.european_aqi,p=AQ.current.pm2_5,p10=AQ.current.pm10;
  const lv=a<=20?['Отличный','g']:a<=40?['Хороший','g']:a<=60?['Умеренный','w']:a<=80?['Плохой','r']:['Очень плохой','r'];
  const hint=a<=40?'Можно гулять и проветривать дом.':a<=60?'Чувствительным людям лучше недолго на улице.':'Лучше закрыть окна и меньше быть на улице.';
  box.innerHTML=`<div class="two"><div class="mini"><div class="k">Индекс</div><div class="v"><span class="st ${lv[1]==='g'?'':lv[1]}"></span>${lv[0]}, ${Math.round(a)}</div><div class="d">${hint}</div><div class="meter"><i data-w="${Math.min(100,a)}" style="background:linear-gradient(90deg,#5fe3a1,#ffd166,#ff6b6b)"></i></div></div>
  <div class="mini"><div class="k">Пыль в воздухе</div><div class="v">${p!=null?p.toFixed(0):'-'} <small style="font-size:14px;color:var(--ink2)">PM2.5</small></div><div class="d">PM10: ${p10!=null?p10.toFixed(0):'-'} мкг/м³. Чем меньше, тем чище.</div></div></div>`;
  setTimeout(()=>box.querySelectorAll('.meter i').forEach(i=>i.style.width=i.dataset.w+'%'),300);
}

/* ---------- появление блоков ---------- */
let io;
function observe(){
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
  let n=0;document.querySelectorAll('.reveal:not(.in)').forEach(el=>{setTimeout(()=>io.observe(el),n*110);n++});
}

/* ---------- блик стекла за пальцем ---------- */
document.addEventListener('pointermove',e=>{
  const g=e.target.closest&&e.target.closest('.glass');
  document.querySelectorAll('.glass.lit').forEach(x=>{if(x!==g)x.classList.remove('lit')});
  if(!g)return;const r=g.getBoundingClientRect();
  g.style.setProperty('--x',(e.clientX-r.left)+'px');g.style.setProperty('--y',(e.clientY-r.top)+'px');g.classList.add('lit');
},{passive:true});
document.addEventListener('pointerleave',()=>document.querySelectorAll('.glass.lit').forEach(x=>x.classList.remove('lit')));

/* ---------- эффекты фона: снег, дождь, звёзды ---------- */
const FX=(()=>{
  const cv=$('#fx'),cx=cv.getContext('2d'),fl=$('#flash');
  let w=0,h=0,dpr=1,mode='none',parts=[],wind=0,raf=0,night=false,boltT=0;
  function size(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;cx.setTransform(dpr,0,0,dpr,0,0);seed()}
  function seed(){
    parts=[];let n=0;
    if(mode==='snow')n=Math.round(w*h/9000);
    else if(mode==='rain')n=Math.round(w*h/5500);
    else if(mode==='stars')n=Math.round(w*h/9000);
    for(let i=0;i<n;i++)parts.push(mk(true));
  }
  function mk(init){
    if(mode==='snow')return{x:Math.random()*w,y:init?Math.random()*h:-10,r:.8+Math.random()*2.4,v:.4+Math.random()*1.1,ph:Math.random()*6.28,o:.35+Math.random()*.55};
    if(mode==='rain')return{x:Math.random()*w,y:init?Math.random()*h:-30,l:10+Math.random()*16,v:11+Math.random()*9,o:.12+Math.random()*.3};
    return{x:Math.random()*w,y:Math.random()*h*.8,r:.4+Math.random()*1.2,ph:Math.random()*6.28,sp:.4+Math.random()*1.4};
  }
  function frame(t){
    raf=requestAnimationFrame(frame);
    cx.clearRect(0,0,w,h);
    if(mode==='snow'){
      for(const p of parts){p.y+=p.v;p.x+=Math.sin(t/1200+p.ph)*.5+wind*.35;
        if(p.y>h+10||p.x>w+20||p.x<-20){Object.assign(p,mk(false));if(p.x>w||p.x<0)p.x=Math.random()*w}
        cx.beginPath();cx.fillStyle=`rgba(235,244,255,${p.o})`;cx.shadowColor='rgba(200,225,255,.6)';cx.shadowBlur=p.r*3;cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
      cx.shadowBlur=0;
    }else if(mode==='rain'){
      cx.lineWidth=1.1;cx.lineCap='round';const dx=2+wind*.6;
      for(const p of parts){p.y+=p.v;p.x+=dx*p.v/10;
        if(p.y>h){Object.assign(p,mk(false))}
        cx.strokeStyle=`rgba(190,225,255,${p.o})`;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-dx*p.l/10,p.y-p.l);cx.stroke()}
    }else if(mode==='stars'){
      for(const p of parts){const a=.25+.75*Math.abs(Math.sin(t/1000*p.sp+p.ph));cx.beginPath();cx.fillStyle=`rgba(255,255,255,${a*.8})`;cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
    }
    if(boltT&&t>boltT){boltT=0;lightning()}
  }
  function lightning(){
    fl.animate([{opacity:0},{opacity:.35},{opacity:.05},{opacity:.28},{opacity:0}],{duration:620,easing:'ease-out'});
    if(document.visibilityState==='visible')boltT=performance.now()+6000+Math.random()*9000;
  }
  function set(f,isDay,code,ws){
    let m='none';
    if(f==='snow')m='snow';else if(f==='rain'||f==='storm')m='rain';else if(!isDay&&(f==='clear'||f==='pcloud'))m='stars';
    wind=Math.min(6,(ws||0)*.5);
    if(RM)m='none';
    if(m!==mode){mode=m;seed()}
    boltT=f==='storm'&&!RM?performance.now()+2500:0;
    if(!raf)raf=requestAnimationFrame(frame);
  }
  addEventListener('resize',size);size();
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else if(!raf)raf=requestAnimationFrame(frame)});
  return{set};
})();

/* ---------- запуск ---------- */
$('#refresh').addEventListener('click',()=>load(true));
$('#retry').addEventListener('click',()=>load(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-updated>10*60e3)load()});
setInterval(()=>{if(!document.hidden&&Date.now()-updated>15*60e3)load()},60e3);

try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s&&s.W&&Date.now()-s.updated<12*3600e3){W=s.W;AQ=s.AQ;updated=s.updated;render(true)}
}catch(e){}
load();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
